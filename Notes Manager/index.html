<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-section">

        <div id="headings-section">
            <h1 class="heading">My Notes</h1>
            <p>Capture your ideas</p>
        </div>

        <div class="counters">
            <div class="total-notes">
                <h2>Total notes</h2>
                <p id="js-total-notes"></p>
            </div>
            <div class="total-study-notes">
                <h2>Study notes</h2>
                <p id="js-total-study-notes"></p>
            </div>
        </div>

        <div class="notes-adding-section">
            <div class="notes">

                <input type="text" name="js-notes-title" id="js-notes-title" placeholder="Notes title">

                <input type="text" name="js-notes-data" id="js-notes-data" placeholder="Write your note...">
            </div>

            <div class="notes-category">

                <select name="js-notes-category" id="js-notes-category">
                    <option value="study">Study</option>
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                </select>

                <button id="js-add-note-btn">Add Note</button>
            </div>
        </div>

        <div class="notes-display-section">
            <div id="search">
                <input type="text" name="js-search" id="js-search" placeholder="Search notes...">
                <button id="js-search-btn">Search</button>
            </div>
            <div class="js-notes-display">

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
