<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Product Inventory Manager</h1>
    <div class="addProducts">
        <h2>Add products</h2>

        <div class="name">
            <p>Product name</p>
            <input type="text" name="productName" id="productName" placeholder="product name">
        </div>

        <div class="productPrice">
            <p>Product Price</p>
            <input type="text" name="price" id="price" placeholder="Enter price">
        </div>

        <div class="productQuantity">
            <p>Quantity</p>
            <input type="text" name="quantity" id="quantity" placeholder="Enter quantity">
        </div>

        <button class="add" onclick="addProduct()">Add Product</button>
    </div>

    <div class="dashboard">
        <div class="totalProducts">
            <p>Products</p>
            <p class="total"></p>
        </div>
        <div class="value">
            <p>Inventory value</p>
            <p class="totalValue"></p>
        </div>
    </div>

    <div class="products">
        <h2>Products</h2>
        <input type="text" name="searchItem" id="searchItem" placeholder="search">
        <button onclick="search()">search</button>
        <div class="js-products"></div>
    </div>

    <script src="script.js">
       
    </script>
</body>

</html>
